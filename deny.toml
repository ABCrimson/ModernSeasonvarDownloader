[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained crates we depend on directly. Tauri 2 on Linux pulls in the
# unmaintained gtk-rs GTK3 bindings (RUSTSEC-2024-0411..0420), paste, proc-macro-error and
# unic-* (via urlpattern) transitively — "No safe upgrade is available" for any of them.
# Vulnerability advisories still apply to the whole graph.
unmaintained = "workspace"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "BSL-1.0", "0BSD", "Unlicense", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
